<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; font-family: "Segoe UI", sans-serif; user-select: none; }
  .layer { position: fixed; inset: 0; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
  .layer.visible { opacity: 1; pointer-events: auto; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; padding: 20px 28px;
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, rgba(0,0,0,0.75), transparent);
  }
  .back-btn {
    background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 50%;
    width: 36px; height: 36px; cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,0.22); }
  .back-label { color: #fff; font-size: 14px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .title { color: #fff; font-size: 14px; opacity: 0.75; margin-left: auto; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

  .bottom {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 18px 28px 22px;
    background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
    display: flex; flex-direction: column; gap: 10px;
  }
  .seek-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #ccc; }
  .seek-row input[type="range"] { flex: 1; accent-color: #e6392f; }
  .controls-row { display: flex; align-items: center; gap: 16px; }
  .icon-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; }
  .icon-btn:hover { background: rgba(255,255,255,0.12); }
  input[type="range"] { accent-color: #e6392f; }
  .center-msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; pointer-events: none; }
  .error { color: #e6392f; }
</style>
</head>
<body>
  <div id="topLayer" class="layer visible">
    <div class="topbar">
      <button class="back-btn" id="backBtn">←</button>
      <span class="back-label" id="backLabel">Back</span>
      <span class="title" id="title"></span>
    </div>
  </div>

  <div id="bottomLayer" class="layer visible">
    <div class="bottom">
      <div class="seek-row">
        <span id="timeCur">--:--</span>
        <input type="range" id="seek" min="0" max="100" value="0" />
        <span id="timeDur">LIVE</span>
        <span id="buffer" style="margin-left:12px;opacity:0.6"></span>
      </div>
      <div class="controls-row">
        <button class="icon-btn" id="playPause">❚❚</button>
        <span style="font-size:12px;color:#ccc">🔊</span>
        <input type="range" id="volume" min="0" max="130" value="100" style="width:100px" />
      </div>
    </div>
  </div>

  <div id="centerMsg" class="center-msg">Starting playback engine…</div>

  <script src="playerControls.js"></script>
</body>
</html>
